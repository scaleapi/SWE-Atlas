[metadata]
author_name = "ScaleAI"
author_email = "unknown"
difficulty = "easy"
category = "refactoring"
tags = ["refactoring", "master-validator", "rubric-graded", "Python"]

[verifier]
timeout_sec = 7200

[verifier.env]
EVAL_API_KEY = "${OPENAI_API_KEY}"
EVAL_BASE_URL = "${OPENAI_API_BASE}"
EVAL_MODEL = "${EVAL_MODEL:-anthropic/claude-opus-4-5-20251101}"

[agent]
timeout_sec = 10800
network_mode = "allowlist"
allowed_hosts = [
  "pypi.org",
  "files.pythonhosted.org",
  "deb.debian.org",
  "security.debian.org",
  "ftp.debian.org",
  "snapshot.debian.org",
  "archive.ubuntu.com",
  "security.ubuntu.com",
  "ports.ubuntu.com",
  "dl-cdn.alpinelinux.org",
  "go.dev",
  "dl.google.com",
  "registry.npmjs.org",
  "registry.yarnpkg.com",
  "nodejs.org",
]

[environment]
docker_image = "ghcr.io/scaleapi/swe-atlas-v1.1:swe_atlas_RF_simple-login_app_69391d8d1ce51c407be1e533_1.1@sha256:72b73538a3fdbf2e162b2f49dde08a3d6fa42611b588d5fb39b67757a70a9f9c"
build_timeout_sec = 1800
allow_internet = true
cpus = 16
memory_mb = 16384
storage_mb = 20480

  "deb.debian.org",
  "security.debian.org",
  "ftp.debian.org",
  "snapshot.debian.org",
  "archive.ubuntu.com",
  "security.ubuntu.com",
  "ports.ubuntu.com",
  "dl-cdn.alpinelinux.org",
  "go.dev",
  "dl.google.com",
  "registry.npmjs.org",
  "registry.yarnpkg.com",
  "nodejs.org",
]

[environment]
docker_image = "ghcr.io/scaleapi/swe-atlas-v1.1:swe_atlas_RF_trufflesecurity_trufflehog_697e7458be1623d850a88844_1.1@sha256:ef8f113cec3c3023b866a53e1568fa095768212ad04b0507d244d7d32d0acb50"

[metadata]
author_name = "ScaleAI"
author_email = "unknown"
difficulty = "hard"
category = "refactoring"
tags = ["refactoring", "master-validator", "rubric-graded", "Go"]

[verifier]
timeout_sec = 7200

[verifier.env]
EVAL_API_KEY = "${OPENAI_API_KEY}"
EVAL_BASE_URL = "${OPENAI_API_BASE}"
EVAL_MODEL = "${EVAL_MODEL:-anthropic/claude-opus-4-5-20251101}"

[agent]
timeout_sec = 10800
network_mode = "allowlist"
allowed_hosts = [
  "pypi.org",
  "files.pythonhosted.org",
  "deb.debian.org",
  "security.debian.org",
  "ftp.debian.org",
  "snapshot.debian.org",
  "archive.ubuntu.com",
  "security.ubuntu.com",
  "ports.ubuntu.com",
  "dl-cdn.alpinelinux.org",
  "go.dev",
  "dl.google.com",
  "registry.npmjs.org",
  "registry.yarnpkg.com",
  "nodejs.org",
]

[environment]
docker_image = "ghcr.io/scaleapi/swe-atlas-v1.1:swe_atlas_RF_grafana_grafana_696719205599a51110d4b45b_1.1@sha256:8d0194c6a3c48ba1803c75d80fe8b8db10daf8cd3bc71ef87f355d0f5677ec16"
build_timeout_sec = 1800
allow_internet = true
cpus = 16
memory_mb = 16384
storage_mb = 20480

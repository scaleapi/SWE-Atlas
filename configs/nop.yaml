# An agent that does nothing: every task should score 0.
#   ./run.sh configs/nop.yaml
n_attempts: 1
n_concurrent_trials: 24

# Only infrastructure failures are retried; the exceptions below (an agent timeout among
# them) are real outcomes and are graded as they ran.
retry:
  max_retries: 3
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
  exclude_exceptions:
    - AgentSafetyRefusalError
    - AgentAuthenticationError
    - ModelNotFoundError
    - ApiUsageLimitError
    - OutputTokenExceededError
    - ContextWindowExceededError
    - OutputLengthExceededError
    - ContextLengthExceededError
    - VerifierOutputParseError
    - RewardFileEmptyError
    - AgentTimeoutError

environment:
  type: modal
  # Each sandbox reserves 0.125 CPU and may use up to the task's cpus (task.toml); Modal bills
  # max(reserved, used). Each task sets OMP_NUM_THREADS and the related thread variables to its
  # cpus, so nproc and thread pools see the same core count as with a full reservation.
  cpu_enforcement_policy: limit

agents:
  - name: nop

datasets:
  - path: data/qa
  - path: data/rf
  - path: data/tw

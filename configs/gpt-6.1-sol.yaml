# GPT-6.1 Sol on codex, with the leaderboard settings. Keys in .env: OPENAI_API_KEY (OPENAI_BASE_URL for a proxy).
# The agent runs under a network allowlist: through a proxy, put the proxy's hostname below.
#   ./run.sh configs/gpt-6.1-sol.yaml
n_attempts: 3
n_concurrent_trials: 24

# Only infrastructure failures are retried; the exceptions below (an agent timeout among
# them) are real outcomes and are graded as they ran.
retry:
  max_retries: 3
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
  exclude_exceptions:
    - AgentSafetyRefusalError
    - AgentAuthenticationError
    - ModelNotFoundError
    - ApiUsageLimitError
    - OutputTokenExceededError
    - ContextWindowExceededError
    - OutputLengthExceededError
    - ContextLengthExceededError
    - VerifierOutputParseError
    - RewardFileEmptyError
    - AgentTimeoutError

environment:
  type: modal

agents:
  - name: codex
    model_name: openai/gpt-6.1-sol
    extra_allowed_hosts:
      - api.openai.com
    kwargs:
      reasoning_effort: max
      version: 0.142.1
      web_search: disabled
      config:
        model_supports_reasoning_summaries: true

datasets:
  - path: data/qa
  - path: data/rf
  - path: data/tw
